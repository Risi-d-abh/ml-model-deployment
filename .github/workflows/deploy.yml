name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: iris-classifier-api
  CONTAINER_NAME: iris-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build-and-push:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(echo ${{ needs.build-and-push.outputs.image }} | cut -d/ -f1)

            docker pull ${{ needs.build-and-push.outputs.image }}

            docker rm -f ${{ env.CONTAINER_NAME }} || true

            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 80:8000 ${{ needs.build-and-push.outputs.image }}

            for i in $(seq 1 12); do
              if curl --fail --silent http://localhost/health; then
                echo "Health check passed"
                exit 0
              fi

              sleep 2
            done

            echo "Health check failed"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1